<style>
:root{--bg:#f5f9fd;--card:#fff;--ink:#1d2433;--mut:#66758a;--line:#dbe7f3;--head:#0058a4;--navy:#003f78;--blue:#0058a4;--red:#e4162c;--ok:#1e8e4e;--bad:#c0392b;--warn:#b7791f;--inp:#f7fbff}
body{margin:0;background:var(--bg) url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 420'><path d='M0 380 Q390 -70 800 170 Q410 20 0 380Z' fill='%230058a4' fill-opacity='.06'/><path d='M700 118 Q704 146 732 150 Q704 154 700 182 Q696 154 668 150 Q696 146 700 118Z' fill='%23e4162c' fill-opacity='.7'/></svg>") no-repeat right top/820px auto fixed;color:var(--ink);font:14px/1.45 system-ui,"Segoe UI",Arial,sans-serif}
header{background:#fff;color:#1d2433;padding:10px 16px 12px;border-bottom:3px solid #0058a4}
.hd{display:flex;align-items:center;gap:14px}.logo{height:54px;width:auto;display:block}
.ttl b{font-size:17px;display:block;color:#003f78}.ttl small{color:#6b7585}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
nav button{background:#e6eff9;color:#003f78;border:0;padding:7px 12px;border-radius:6px;cursor:pointer}
nav button.on{background:#0058a4;color:#fff;font-weight:600;box-shadow:0 3px 0 #e4162c}
main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:10px;padding:14px;margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:10px;padding:12px;text-align:center}
.kpi b{display:block;font-size:26px;color:var(--blue)}.kpi span{color:var(--mut);font-size:12px}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;background:var(--card)}
th{background:#e1eefb;color:#003f78;text-align:left;padding:8px;font-size:12px}td{padding:8px;border-bottom:1px solid var(--line)}
.row{cursor:pointer}.row:hover{background:#eef5fc}
.b{padding:2px 9px;border-radius:10px;font-size:12px;color:#fff;white-space:nowrap}
.ok{background:var(--ok)}.bad{background:var(--bad)}.wn{background:var(--warn)}.rv{background:var(--blue)}
label{display:block;font-weight:600;margin:10px 0 3px}
input,select,textarea{width:100%;box-sizing:border-box;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--inp);color:var(--ink);font:inherit}
textarea{min-height:70px}
button{background:var(--blue);color:#fff;border:0;padding:9px 16px;border-radius:6px;cursor:pointer;font:inherit}
button.g{background:var(--ok)}button.r{background:var(--bad)}button.w{background:var(--warn)}button.l{background:var(--mut)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.mut{color:var(--mut)}ul.wf{list-style:none;padding:0;margin:0}ul.wf li{padding:4px 0}ul.wf li.cur{font-weight:700;color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 16px}
h2,h3{margin:4px 0 10px;color:var(--head)}input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:1px}button:hover{filter:brightness(1.1)}.stp{display:grid;grid-template-columns:62px 1fr 1fr auto;gap:8px;align-items:center;margin:6px 0}.stp button{padding:6px 10px}.acts2{display:flex;gap:4px}@media (max-width:640px){.stp{grid-template-columns:1fr 1fr}}footer{text-align:center;color:var(--mut);font-size:12px;padding:6px 16px 22px}footer i{color:var(--red);font-style:normal}a{color:var(--blue)}.ds{max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

let reqs=[],me=null,prof=null,roster=[],allProfiles=[],editId=null,st='login',view='home',openId=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>t?new Date(t).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'-';

const SUPABASE_URL='https://xsbfwuoxsoxkgoahoymq.supabase.co',SUPABASE_KEY='sb_publishable_0ZqkuX-S4cS75agaEYdqng_MPrDaYOI';
const sb=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const iso=t=>t?Date.parse(t):null;
const must=r=>{if(r.error)throw new Error(r.error.message);return r.data};
function toReq(x){
  const st=(x.request_steps||[]).slice().sort((a,b)=>a.step_no-b.step_no).map(s=>({no:s.step_no,dept:s.department,name:s.step_name,approver:s.approver_name,approverId:s.approver_id,status:s.step_status,at:iso(s.acted_at),comment:s.comment||''}));
  return{id:x.id,no:x.request_no,type:x.request_type,title:x.title,desc:x.description||'',project:x.project,loc:x.location||'',prio:x.priority,reqDate:x.required_date||'',remarks:x.remarks||'',by:x.created_by_name,byId:x.created_by,created:iso(x.created_at),cur:x.current_step,dept:x.current_department||'',status:x.status,rev:x.revision_no,last:iso(x.last_action_at),steps:st,hist:[],comments:[],attach:[]};
}
async function loadAll(){
  const [rq,pf]=await Promise.all([sb.from('requests').select('*, request_steps(*)').order('created_at',{ascending:false}),sb.from('profiles').select('*').order('full_name')]);
  allProfiles=must(pf).map(x=>({id:x.id,name:x.full_name,role:x.job_title||'',dept:x.department,create:x.can_create,approve:x.can_approve,admin:x.is_admin,active:x.active,email:x.email||''}));
  roster=allProfiles.filter(x=>x.active);
  reqs=must(rq).map(toReq);
  prof=roster.find(x=>x.id===me.id)||null;
}
async function loadDetail(id){
  const [a,c,t]=await Promise.all([sb.from('approvals').select('*').eq('request_id',id).order('created_at'),sb.from('comments').select('*').eq('request_id',id).order('created_at'),sb.from('attachments').select('*').eq('request_id',id).order('created_at')]);
  const r=reqs.find(x=>x.id===id);if(!r)return;
  r.hist=must(a).map(x=>({t:iso(x.created_at),who:x.actor_name,dept:x.department,act:x.action,comment:x.comments||'',status:x.status}));
  r.comments=must(c).map(x=>({t:iso(x.created_at),who:x.user_name,dept:x.department,text:x.body}));
  r.attach=must(t).map(x=>({name:x.file_name,path:x.storage_path,size:x.size_bytes||0,by:x.uploaded_by_name,at:iso(x.created_at)}));
}
async function refresh(force){await loadAll();if(openId)await loadDetail(openId);render(force)}
let rt=null,tmr=null;
const later=()=>{clearTimeout(tmr);tmr=setTimeout(()=>refresh().catch(()=>{}),700)};
function listen(){
  if(rt)return;rt=sb.channel('rq');
  ['requests','request_steps','comments','approvals'].forEach(t=>rt.on('postgres_changes',{event:'*',schema:'public',table:t},later));
  rt.subscribe();
}

const P=()=>prof;
const canAct=r=>{const p=P();if(!p||!p.approve||r.status!=='Pending')return false;const s=r.steps.find(x=>x.no===r.cur);return !!s&&s.approverId===p.id&&s.dept===p.dept};
const badge=s=>`<span class="b ${({Approved:'ok',Rejected:'bad','Revision Required':'rv'})[s]||'wn'}">${esc(s)}</span>`;
const stepTxt=r=>r.cur?`${r.steps.findIndex(s=>s.no===r.cur)+1} of ${r.steps.length}`:'-';
const table=rows=>rows.length?`<div class="sc"><table><tr><th>Request No.</th><th>Title</th><th>Description</th><th>Date</th><th>Priority</th><th>Current Dept</th><th>Step</th><th>Status</th><th>Action</th></tr>${rows.map(r=>`<tr class="row" data-a="open" data-v="${esc(r.id)}"><td>${esc(r.no)}</td><td>${esc(r.title)}</td><td class="ds" title="${esc(r.desc)}">${esc(r.desc)}</td><td>${fmt(r.created)}</td><td>${esc(r.prio)}</td><td>${esc(r.dept)}</td><td>${stepTxt(r)}</td><td>${badge(r.status)}</td><td><button class="${canAct(r)?'g':'l'}" data-a="open" data-v="${esc(r.id)}">${canAct(r)?'REVIEW':'OPEN'}</button></td></tr>`).join('')}</table></div>`:'<p class="mut">Nothing here yet.</p>';
const foot='<footer><i>&#10022;</i> Bani Limited Co. | AL ROSSIAS Tower</footer>';
const plain=i=>`<header><div class="hd"><img class="logo" src="${LOGO}" alt="Bani Limited Co."><div class="ttl"><b>AL ROSSIAS Tower - Request &amp; Approval System</b><small>Bani Limited Co. - online version</small></div></div></header><main>${i}</main>${foot}`;
function shell(inner,p){
  const pc=reqs.filter(canAct).length;
  const tabs=[['home','Home'],['mine','My Requests'],['pending','Pending ('+pc+')']].concat(p.create?[['new','Create Request']]:[],me.isOwner?[['admin','Admin']]:[]);
  return `<header><div class="hd"><img class="logo" src="${LOGO}" alt="Bani Limited Co."><div class="ttl"><b>AL ROSSIAS Tower - Request &amp; Approval System</b><small>Logged in as: ${esc(p.name)} | ${esc(p.role)} | ${esc(p.dept)}</small></div></div><nav>${tabs.map(([k,l])=>`<button class="${view===k&&!openId?'on':''}" data-a="go" data-v="${k}">${l}</button>`).join('')}<button data-a="chpw">Password</button><button data-a="logout">Logout</button></nav></header><main>${inner}</main>${foot}`;
}
function home(p){
  const all=p.create||me.isOwner,pend=reqs.filter(canAct),c=f=>reqs.filter(f).length;
  const k=all?[['Total Requests',reqs.length],['Pending',c(r=>r.status==='Pending')],['Approved',c(r=>r.status==='Approved')],['Rejected',c(r=>r.status==='Rejected')],['Returned',c(r=>r.status==='Revision Required')],['Awaiting my approval',pend.length]]:[['Awaiting my approval',pend.length]];
  return `<div class="cards">${k.map(([a,v])=>`<div class="kpi"><b>${v}</b><span>${a}</span></div>`).join('')}</div><h3>${all?'Recently submitted':'Waiting for my approval'}</h3>${table(all?reqs.slice(0,8):pend)}`;
}
const canPdf=(r,p)=>!!p&&(r.byId===p.id||p.admin||r.steps.some(s=>s.approverId===p.id));
let buildSteps=[{dept:'',who:''}];
function stepsHtml(){
  const depts=[...new Set(roster.filter(x=>x.approve).map(x=>x.dept))];
  return buildSteps.map((s,i)=>`<div class="stp"><b>Step ${i+1}</b><select data-ch="dept" data-i="${i}"><option value="">Department...</option>${depts.map(d=>`<option${d===s.dept?' selected':''}>${esc(d)}</option>`).join('')}</select><select data-ch="who" data-i="${i}"><option value="">Engineer...</option>${roster.filter(x=>x.approve&&x.dept===s.dept).map(x=>`<option value="${esc(x.id)}"${x.id===s.who?' selected':''}>${esc(x.name)}</option>`).join('')}</select><span class="acts2"><button class="l" data-a="upstep" data-v="${i}" title="Move up">&uarr;</button><button class="l" data-a="dnstep" data-v="${i}" title="Move down">&darr;</button><button class="r" data-a="rmstep" data-v="${i}" title="Remove step">&times;</button></span></div>`).join('')+'<div class="acts"><button data-a="addstep">+ ADD STEP</button></div>';
}
const redraw=()=>{const b=$('#stepsbox');if(b)b.innerHTML=stepsHtml()};
function newForm(){
  return `<div class="card"><h2>Create Request</h2><label>Request Type</label><select id="ty"><option>General</option><option>Technical</option><option>Construction</option><option>Procurement</option></select><label>Request Title *</label><input id="t"><label>Request Description</label><textarea id="d"></textarea><div class="grid"><div><label>Project</label><input id="pj" value="${esc(PROJECT)}" readonly></div><div><label>Location</label><input id="lc"></div><div><label>Priority</label><select id="pr"><option>Low</option><option selected>Normal</option><option>High</option><option>Urgent</option></select></div><div><label>Required Date</label><input id="rd" type="date"></div></div><label>Remarks</label><textarea id="rm"></textarea><label>Attach files <span class="mut">(optional - PDF, Word or Excel, up to 25 MB each)</span></label><div class="acts"><button class="l" data-a="pick">Choose files...</button></div><p id="pl" class="mut">No file chosen.</p><h3 style="margin-top:16px">Workflow steps</h3><p class="mut">Build the approval path for this request. Step 1 is you (submission). The request then moves through the steps below, in order.</p><div id="stepsbox">${stepsHtml()}</div><div class="acts"><button class="g" data-a="submit">SUBMIT REQUEST</button></div></div>`;
}
function detail(r,p){
  const cur=r.status==='Pending';
  const att=`<div class="card"><h3>Attachments</h3>${(r.attach||[]).map(a=>`<p>${/\.pdf$/i.test(a.name)?'&#128196;':/\.xlsx?$/i.test(a.name)?'&#128215;':'&#128210;'} <a href="#" data-a="pdf" data-v="${esc(a.path)}">${esc(a.name)}</a> <span class="mut">${Math.round(a.size/1024)} KB - ${esc(a.by)}, ${fmtT(a.at)}</span></p>`).join('')||'<p class="mut">No files attached.</p>'}${canPdf(r,p)?`<div class="acts"><button data-a="addpdf" data-v="${esc(r.id)}">+ ADD FILE (choose files)</button></div>`:''}</div>`;
  const wf=r.steps.map(s=>{const ic=(s.status==='Approved'||s.status==='Submitted')?'&#10003;':s.status==='Rejected'?'&#10007;':s.status==='Returned'?'&#8617;':(s.no===r.cur&&cur)?'&#8594;':'&#9675;';return `<li class="${s.no===r.cur&&cur?'cur':''}">${ic} ${s.no}. ${esc(s.dept)} <span class="mut">${s.approver?'('+esc(s.approver)+')':''} ${esc(s.status)}</span></li>`}).join('');
  const hist=r.hist.map(h=>`<tr><td>${fmtT(h.t)}</td><td>${esc(h.who)}</td><td>${esc(h.dept)}</td><td>${esc(h.act==='Attach PDF'?'Attach file':h.act)}</td><td>${esc(h.comment)}</td></tr>`).join('');
  const cm=r.comments.map(c=>`<p><b>${esc(c.who)}</b> <span class="mut">${esc(c.dept)} - ${fmtT(c.t)}</span><br>${esc(c.text)}</p>`).join('')||'<p class="mut">No comments.</p>';
  const wait=(cur&&!canAct(r))?`<div class="card mut">Waiting for <b>${esc(((r.steps.find(s=>s.no===r.cur)||{}).approver)||'')}</b> (${esc(r.dept)}) to review. The approval buttons appear here for the assigned approver only.</div>`:'';
  const del=me.isOwner?`<div class="card"><h3>Administrator</h3><p class="mut">Permanently deletes this request with its history, comments and files. This cannot be undone.</p><div class="acts"><button class="r" data-a="delreq" data-v="${esc(r.id)}">DELETE THIS REQUEST</button></div></div>`:'';
  const act=canAct(r)?`<div class="card"><h3>Your decision</h3><textarea id="cm" placeholder="Comment (optional when approving - required for Reject / Return)"></textarea><div class="acts"><button class="g" data-a="act" data-v="Approve">APPROVE</button><button class="r" data-a="act" data-v="Reject">REJECT</button><button class="w" data-a="act" data-v="Return">RETURN FOR REVISION</button></div></div>`:'';
  const rev=(r.status==='Revision Required'&&r.byId===p.id)?`<div class="card"><h3>Revise and resubmit</h3><label>Title</label><input id="et" value="${esc(r.title)}"><label>Description</label><textarea id="ed">${esc(r.desc)}</textarea><div class="acts"><button class="g" data-a="resub" data-v="${esc(r.id)}">RESUBMIT</button></div></div>`:'';
  return `<button class="l" data-a="back">&larr; Back</button><div class="card" style="margin-top:10px"><h2>${esc(r.no)} - ${esc(r.title)} ${badge(r.status)}</h2><div class="grid"><div><b>Type:</b> ${esc(r.type)}</div><div><b>Project:</b> ${esc(r.project)||'-'}</div><div><b>Location:</b> ${esc(r.loc)||'-'}</div><div><b>Priority:</b> ${esc(r.prio)}</div><div><b>Required:</b> ${esc(r.reqDate)||'-'}</div><div><b>Requested by:</b> ${esc(r.by)}</div><div><b>Created:</b> ${fmtT(r.created)}</div><div><b>Current:</b> ${esc(r.dept)} (${stepTxt(r)})</div><div><b>Revision:</b> ${r.rev}</div></div><p>${esc(r.desc)}</p><p class="mut">${esc(r.remarks)}</p></div><div class="card"><h3>Workflow</h3><ul class="wf">${wf}</ul></div>${act||wait}${rev}${att}<div class="card"><h3>Comments - add your comment here</h3>${cm}<textarea id="nc" placeholder="Write a comment..."></textarea><div class="acts"><button data-a="comm" data-v="${esc(r.id)}">ADD COMMENT</button></div></div><div class="card"><h3>History</h3><div class="sc"><table><tr><th>When</th><th>Who</th><th>Dept</th><th>Action</th><th>Comment</th></tr>${hist}</table></div></div>${del}`;
}
function admin(){
  const x=allProfiles.find(p=>p.id===editId)||{name:'',role:'',dept:'',email:'',create:false,approve:false,admin:false,active:true};
  const depts=[...new Set(allProfiles.map(p=>p.dept))].sort();
  const cb=(id,on,t)=>`<label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" id="${id}" style="width:auto"${on?' checked':''}> ${t}</label>`;
  const rows=allProfiles.map(p=>`<tr class="${p.active?'':'mut'}"><td>${esc(p.name)}</td><td>${esc(p.role)}</td><td>${esc(p.dept)}</td><td>${p.create?'Create ':''}${p.approve?'Approve ':''}${p.admin?'Admin':''}</td><td>${p.active?'Active':'Inactive'}</td><td><button data-a="editp" data-v="${esc(p.id)}">Edit</button></td></tr>`).join('');
  return `<div class="card"><h3>Team</h3><div class="sc"><table><tr><th>Name</th><th>Position</th><th>Department</th><th>Rights</th><th>Status</th><th></th></tr>${rows}</table></div></div>
<div class="card"><h3>${editId?'Edit '+esc(x.name):'Add a person'}</h3>${editId?'':'<p class="mut">First create the person\'s login in Supabase (Authentication &rarr; Users &rarr; Add user, tick Auto Confirm User). Then enter the same email here.</p>'}
<label>Email (login)</label><input id="ap_email" value="${esc(x.email)}"${editId&&x.email?' readonly':''}><label>Full name</label><input id="ap_name" value="${esc(x.name)}"><label>Position</label><input id="ap_title" value="${esc(x.role)}"><label>Department</label><input id="ap_dept" list="dl" value="${esc(x.dept)}"><datalist id="dl">${depts.map(d=>`<option value="${esc(d)}">`).join('')}</datalist>
<div style="margin-top:10px">${cb('ap_create',x.create,'Can create requests')}${cb('ap_approve',x.approve,'Can approve (can be chosen in a workflow)')}${cb('ap_admin',x.admin,'Administrator (manages the team)')}${cb('ap_active',x.active,'Active (can log in and use the system)')}</div>
<div class="acts"><button class="g" data-a="saveprof">SAVE</button>${editId?'<button class="l" data-a="newp">Cancel</button>':''}</div></div>`;
}
function loginHtml(){
  return `<div class="card"><h2>Login</h2><label>Email</label><input id="em" type="email" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password"><div class="acts"><button data-a="login">LOGIN</button></div><p class="mut">Forgot your password? Ask the Administrator to reset it.</p></div>`;
}
function pwHtml(){
  return `<div class="card"><h2>${me.pwDone?'Change password':'Set your own password'}</h2>${me.pwDone?'':'<p class="mut">This is your first login. Choose a new password to continue.</p>'}<label>New password <span class="mut">(at least 8 characters)</span></label><input id="np" type="password" autocomplete="new-password"><label>Repeat new password</label><input id="np2" type="password" autocomplete="new-password"><div class="acts"><button data-a="setpw">SAVE PASSWORD</button>${me.pwDone?'<button class="l" data-a="cancelpw">Cancel</button>':''}</div></div>`;
}
function html(){
  if(st==='login')return plain(loginHtml());
  if(st==='pw')return plain(pwHtml());
  const p=P();let body;
  if(openId){const r=reqs.find(x=>x.id===openId);body=r?detail(r,p):'<p>Request not found.</p>'}
  else if(view==='mine')body='<h3>My Requests</h3>'+table(reqs.filter(r=>me.isOwner||r.byId===p.id||r.steps.some(s=>s.approverId===p.id)));
  else if(view==='pending')body='<h3>Pending my approval</h3>'+table(reqs.filter(canAct));
  else if(view==='new'&&p.create)body=newForm();
  else if(view==='admin'&&me.isOwner)body=admin();
  else body=home(p);
  return shell(body,p);
}
function render(force){
  const a=document.activeElement;
  if(!force&&a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;
  if(!force&&st==='app'&&view==='new'&&!openId)return;
  $('#app').innerHTML=html();
}
/* ---- actions ---- */
let pickedPdfs=[];
async function start(user){
  me={id:user.id,name:'',isOwner:false,pwDone:!!(user.user_metadata&&user.user_metadata.pw_changed)};
  await loadAll();
  if(!prof){await sb.auth.signOut();me=null;st='login';render(true);return alert('This login has no active profile. Ask the Administrator.')}
  me.name=prof.name;me.isOwner=prof.admin;
  if(!me.pwDone){st='pw';render(true);return}
  st='app';view='home';openId=null;listen();render(true);
}
async function login(){
  const email=$('#em').value.trim().toLowerCase(),pw=$('#pw').value;
  if(!email||!pw)return alert('Enter your email and password.');
  const r=await sb.auth.signInWithPassword({email,password:pw});
  if(r.error)return alert(r.error.message==='Invalid login credentials'?'Wrong email or password.':r.error.message);
  await start(r.data.user);
}
async function setpw(){
  const a=$('#np').value,b=$('#np2').value;
  if(a.length<8)return alert('Use at least 8 characters.');
  if(a!==b)return alert('The two passwords are different.');
  const r=await sb.auth.updateUser({password:a,data:{pw_changed:true}});
  if(r.error)return alert(r.error.message);
  alert('Password saved.');
  const g=await sb.auth.getUser();await start(g.data.user);
}
const MIME={pdf:'application/pdf',doc:'application/msword',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',xls:'application/vnd.ms-excel',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'};
const mimeOf=n=>MIME[String(n).split('.').pop().toLowerCase()]||'application/octet-stream';
const pickFiles=()=>new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept='.pdf,.doc,.docx,.xls,.xlsx';i.multiple=true;i.onchange=()=>res([...i.files]);i.oncancel=()=>res([]);i.click()});
async function uploadPdfs(id,files){
  for(const f of files){
    if(!/\.(pdf|docx?|xlsx?)$/i.test(f.name))throw new Error(f.name+' is not allowed. Use PDF, Word (.doc/.docx) or Excel (.xls/.xlsx) files.');
    if(f.size>25*1048576)throw new Error(f.name+' is larger than 25 MB.');
    const path=id+'/'+Date.now()+'_'+f.name.replace(/[^\w.\-]/g,'_');
    const u=await sb.storage.from('attachments').upload(path,f,{contentType:mimeOf(f.name)});
    if(u.error)throw new Error(u.error.message);
    must(await sb.rpc('register_attachment',{p_request_id:id,p_file_name:f.name,p_path:path,p_size:f.size}));
  }
}
async function submit(){
  const v=i=>$('#'+i).value.trim();
  if(!v('t'))return alert('Enter a request title.');
  if(!buildSteps.length||buildSteps.some(s=>!s.dept||!s.who))return alert('Add at least one workflow step, and choose a department and an engineer for every step.');
  const files=pickedPdfs.slice();
  const id=must(await sb.rpc('create_request',{p_type:v('ty'),p_title:v('t'),p_description:v('d'),p_location:v('lc'),p_priority:$('#pr').value,p_required_date:$('#rd').value||null,p_remarks:v('rm'),p_approvers:buildSteps.map(s=>s.who)}));
  if(files.length){try{await uploadPdfs(id,files)}catch(x){alert('The request was created, but a PDF could not be uploaded: '+x.message)}}
  pickedPdfs=[];buildSteps=[{dept:'',who:''}];await loadAll();openId=id;view='mine';await loadDetail(id);render(true);
}
async function act(a){
  const c=$('#cm').value.trim();if(a!=='Approve'&&!c)return alert('A comment is required.');
  must(await sb.rpc('act_on_request',{p_request_id:openId,p_action:a,p_comment:c||null}));
  await refresh(true);
}
async function resub(id){
  must(await sb.rpc('resubmit_request',{p_request_id:id,p_title:$('#et').value.trim()||null,p_description:$('#ed').value.trim()||null}));
  await refresh(true);
}
async function comm(id){
  const t=$('#nc').value.trim();if(!t)return;
  must(await sb.rpc('add_comment',{p_request_id:id,p_body:t}));
  await refresh(true);
}
async function addpdf(id){
  const files=await pickFiles();if(!files.length)return;
  await uploadPdfs(id,files);await refresh(true);
}
async function delreq(id){
  const r=reqs.find(x=>x.id===id);if(!r||!me.isOwner)return;
  const t=prompt('This permanently deletes '+r.no+' with its history, comments and files.\n\nType the request number to confirm:');
  if(t===null)return;
  if(t.trim().toUpperCase()!==r.no.toUpperCase())return alert('The number did not match. Nothing was deleted.');
  await loadDetail(id);const paths=r.attach.map(a=>a.path);
  if(paths.length){const d=await sb.storage.from('attachments').remove(paths);if(d.error)throw new Error(d.error.message);if((d.data||[]).length!==paths.length)throw new Error('Some files could not be deleted, so nothing was deleted. Try again.')}
  must(await sb.rpc('delete_request',{p_request_id:id}));
  openId=null;view='mine';await refresh(true);alert(r.no+' was deleted.');
}
async function saveprof(){
  const g=i=>$('#'+i),email=g('ap_email').value.trim().toLowerCase();
  if(!email||!g('ap_name').value.trim()||!g('ap_dept').value.trim())return alert('Email, name and department are required.');
  must(await sb.rpc('admin_save_profile',{p_email:email,p_full_name:g('ap_name').value.trim(),p_job_title:g('ap_title').value.trim()||null,p_department:g('ap_dept').value.trim(),p_can_create:g('ap_create').checked,p_can_approve:g('ap_approve').checked,p_is_admin:g('ap_admin').checked,p_active:g('ap_active').checked}));
  editId=null;await refresh(true);alert('Saved.');
}
async function openPdf(path){
  const a=((reqs.find(x=>x.id===openId)||{}).attach||[]).find(x=>x.path===path),isPdf=/\.pdf$/i.test(path);
  const w=isPdf?window.open('','_blank'):null;
  const r=await sb.storage.from('attachments').createSignedUrl(path,120,isPdf?undefined:{download:a?a.name:true});
  if(r.error){if(w)w.close();throw new Error(r.error.message)}
  if(w)w.location.href=r.data.signedUrl;else location.href=r.data.signedUrl;
}
const A={
  go:v=>{view=v;openId=null;render(true)},
  open:async v=>{openId=v;render(true);await loadDetail(v);render(true)},
  back:()=>{openId=null;render(true)},
  logout:async()=>{if(rt){sb.removeChannel(rt);rt=null}await sb.auth.signOut();me=null;prof=null;reqs=[];st='login';render(true)},
  chpw:()=>{st='pw';render(true)},cancelpw:()=>{st='app';render(true)},
  login,setpw,submit,act,resub,comm,addpdf,pdf:openPdf,delreq,saveprof,editp:v=>{editId=v;render(true)},newp:()=>{editId=null;render(true)},
  addstep:()=>{buildSteps.push({dept:'',who:''});redraw()},rmstep:v=>{buildSteps.splice(+v,1);redraw()},
  upstep:v=>{v=+v;if(v>0)[buildSteps[v-1],buildSteps[v]]=[buildSteps[v],buildSteps[v-1]];redraw()},
  dnstep:v=>{v=+v;if(v<buildSteps.length-1)[buildSteps[v+1],buildSteps[v]]=[buildSteps[v],buildSteps[v+1]];redraw()},
  pick:async()=>{pickedPdfs=await pickFiles();$('#pl').textContent=pickedPdfs.map(f=>f.name).join(', ')||'No file chosen.'}
};
document.addEventListener('change',e=>{const t=e.target,d=t&&t.dataset;if(!d||!d.ch)return;const s=buildSteps[+d.i];if(!s)return;if(d.ch==='dept'){s.dept=t.value;s.who='';redraw()}else s.who=t.value});
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-a]');if(!t||!A[t.dataset.a])return;e.preventDefault();
  try{await A[t.dataset.a](t.dataset.v);if(['act','resub','comm','addpdf'].includes(t.dataset.a))render(true)}catch(x){if(!x||x.name!=='AbortError')alert((x&&x.message)||'Something went wrong.')}
});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.target.tagName==='TEXTAREA')return;const b=st==='login'?$('[data-a="login"]'):st==='pw'?$('[data-a="setpw"]'):null;if(b)b.click()});
setInterval(()=>{if(st==='app')refresh().catch(()=>{})},60000);
(()=>{const k=document.createElement('link');k.rel='icon';k.href=LOGO;document.head.appendChild(k)})();
(async()=>{
  if(!sb){$('#app').textContent='Could not load the Supabase library. Check the internet connection and reload.';return}
  const s=await sb.auth.getSession();
  if(s.data&&s.data.session){try{await start(s.data.session.user);return}catch(x){}}
  st='login';render(true);
})();
</script></body></html>
